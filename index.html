<title>Das Dönerhaus · Analyse</title>
<style>
  :root{
    --bg:#f4f1ec; --surface:#fffdfb; --raised:#faf7f2;
    --ink:#241d16; --muted:#7a6f63; --faint:#a99e90; --line:#e7dfd4;
    --accent:#c2410c; --good:#2f7d5b; --warn:#b45309;
    --shadow:0 1px 2px rgba(40,25,10,.05),0 6px 20px rgba(40,25,10,.06);
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#161209; --surface:#201a12; --raised:#261f16;
    --ink:#f3ede4; --muted:#a89d8d; --faint:#7c7264; --line:#342b20;
    --accent:#f2743a; --good:#54b98c; --warn:#e0982f;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  }}
  :root[data-theme="dark"]{
    --bg:#161209; --surface:#201a12; --raised:#261f16;
    --ink:#f3ede4; --muted:#a89d8d; --faint:#7c7264; --line:#342b20;
    --accent:#f2743a; --good:#54b98c; --warn:#e0982f;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45;-webkit-font-smoothing:antialiased}
  .wrap{max-width:980px;margin:0 auto;padding:26px 20px 60px}
  .num,.big,.sv,.bv{font-variant-numeric:tabular-nums}
  .hidden{display:none!important}

  header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin-bottom:18px}
  header h1{margin:0;font-size:1.5rem;font-weight:700;letter-spacing:-.02em}
  header h1 .em{color:var(--accent)}
  #rangeLabel{color:var(--muted);font-weight:600}
  #plRangeLabel{color:var(--muted);font-weight:600;align-self:center;font-size:.85rem}
  #langsel{margin-left:auto;align-self:center}
  #refreshBtn{align-self:center;font:inherit;font-size:.82rem;font-weight:600;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:6px 12px;cursor:pointer}
  #refreshBtn:hover{color:var(--accent);border-color:var(--accent)}

  /* Passwort-Gate */
  .gate{display:flex;justify-content:center;padding:40px 0}
  .gatecard{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);
    padding:30px 28px;max-width:360px;width:100%;text-align:center}
  .gicon{font-size:2rem;margin-bottom:6px}
  .gatecard h2{margin:0 0 4px;font-size:1.1rem}
  .gatecard p{margin:0 0 18px;color:var(--muted);font-size:.88rem}
  #gform{display:flex;flex-direction:column;gap:10px}
  #gpw{font:inherit;font-size:.95rem;padding:11px 13px;border:1px solid var(--line);border-radius:10px;
    background:var(--raised);color:var(--ink);color-scheme:light dark}
  #gform button{font:inherit;font-weight:600;padding:11px;border:0;border-radius:10px;background:var(--accent);color:#fff;cursor:pointer}
  .gerr{margin-top:12px;color:#c0392b;font-size:.84rem;min-height:1em}

  /* Steuerung */
  .controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
  .seg{display:inline-flex;background:var(--raised);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px}
  .seg button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:.86rem;font-weight:600;padding:7px 14px;border-radius:8px;cursor:pointer}
  .seg button.on{background:var(--surface);color:var(--accent);box-shadow:var(--shadow)}
  #langsel button{padding:6px 11px;font-size:.8rem}
  .pick{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:.85rem}
  .pick label{font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;color:var(--faint)}
  input[type=date]{font:inherit;font-size:.86rem;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 9px;color-scheme:light dark}

  /* Seiten-Reiter */
  .topnav{display:flex;gap:4px;margin-bottom:18px;border-bottom:1px solid var(--line)}
  .topnav button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:.95rem;font-weight:700;padding:9px 14px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
  .topnav button.on{color:var(--accent);border-bottom-color:var(--accent)}

  /* Gehälter */
  .periodhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px;margin-bottom:12px}
  .periodhead .pay{font-size:1.05rem;font-weight:700}
  .periodhead .zr{color:var(--muted);font-size:.85rem}
  .tax-badge{font-size:.68rem;text-transform:uppercase;letter-spacing:.04em;color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 40%,var(--line));border-radius:99px;padding:2px 9px}

  /* Gewinn */
  table.gewinn{width:100%;border-collapse:collapse;font-size:.92rem}
  table.gewinn td{padding:8px 0;border-top:1px solid var(--line)}
  table.gewinn td.num{text-align:right;font-variant-numeric:tabular-nums}
  table.gewinn tr.mid td{border-top:2px solid var(--line);font-weight:600}
  table.gewinn tfoot td{border-top:2px solid var(--line);font-weight:800;font-size:1.1rem;padding-top:11px}

  .flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
  .flow .cell{flex:1 1 150px;display:flex;flex-direction:column;gap:3px;padding:6px 8px}
  .flow .op{display:flex;align-items:center;justify-content:center;font-size:1.5rem;color:var(--faint)}
  .flow .lbl{font-size:.76rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
  .flow .big{font-size:1.9rem;font-weight:700;letter-spacing:-.02em;line-height:1.1}
  .flow .sub{font-size:.74rem;color:var(--faint)}
  .flow .cur{font-size:1rem;font-weight:600;color:var(--muted)}
  .flow .net{background:linear-gradient(180deg,color-mix(in srgb,var(--good) 12%,transparent),transparent);border:1px solid color-mix(in srgb,var(--good) 35%,var(--line));border-radius:12px}
  .flow .net .big{color:var(--good)} .flow .prov .big{color:var(--warn)}

  .grid{display:grid;grid-template-columns:1fr;gap:14px}
  @media(min-width:760px){.grid.two{grid-template-columns:1.35fr .65fr}}
  section.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}
  h2{margin:0 0 14px;font-size:.82rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}

  .chart{display:flex;align-items:flex-end;gap:4px;height:150px;padding-top:6px}
  .col{flex:1 1 0;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0}
  .colbar{width:100%;max-width:26px;background:var(--raised);border-radius:5px 5px 0 0;display:flex;flex-direction:column-reverse;overflow:hidden;height:120px}
  .colbar .net{background:var(--accent);width:100%}
  .colbar .prov{background:color-mix(in srgb,var(--warn) 40%,transparent);width:100%}
  .col .cl{font-size:.62rem;color:var(--faint);white-space:nowrap}
  .chart-hint{font-size:.74rem;color:var(--faint);margin-top:10px;display:flex;gap:14px;flex-wrap:wrap}
  .chart-hint i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:middle}

  .stack{display:flex;height:26px;border-radius:7px;overflow:hidden;margin-bottom:12px;background:var(--raised)}
  .stack .seg{height:100%}
  .legend{display:flex;flex-wrap:wrap;gap:7px 16px;margin-bottom:16px}
  .lg{font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:6px}
  .lg i,.ch i{width:10px;height:10px;border-radius:3px;display:inline-block;flex:0 0 auto}

  details.monat{border-top:1px solid var(--line);padding:11px 0}
  details.monat:first-of-type{border-top:0}
  details.monat summary{cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;list-style:none;padding:2px 0;font-weight:600}
  details.monat summary::-webkit-details-marker{display:none}
  details.monat summary .car{display:inline-block;margin-right:8px;color:var(--faint);transition:transform .15s ease;font-size:.8rem}
  details.monat[open] summary .car{transform:rotate(90deg)}
  details.monat summary .msum{font-weight:700;color:var(--ink)}
  details.monat table{margin-top:12px}

  table{width:100%;border-collapse:collapse;font-size:.9rem}
  thead th{font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;color:var(--faint);font-weight:600;text-align:right;padding:0 0 8px}
  thead th.l{text-align:left}
  tbody td{padding:9px 0;border-top:1px solid var(--line)}
  td.ch{display:flex;align-items:center;gap:9px;font-weight:500}
  td.num{text-align:right;font-variant-numeric:tabular-nums}
  .prov .warn{color:var(--warn)} .prov .rate{color:var(--faint);font-size:.72rem;margin-left:6px}
  .prov .none{color:var(--faint)}
  tfoot td{padding:11px 0 0;border-top:2px solid var(--line);font-weight:700}
  tfoot td.net{color:var(--good)}

  .stat{display:flex;flex-direction:column;gap:2px;padding:11px 0;border-top:1px solid var(--line)}
  .stat:first-of-type{border-top:0}
  .stat .sv{font-size:1.35rem;font-weight:700;letter-spacing:-.01em}
  .stat .sl{font-size:.78rem;color:var(--muted)}
  .stat.hl .sv{color:var(--accent)}

  .bar{display:grid;grid-template-columns:minmax(0,1fr) 92px;grid-template-rows:auto auto;align-items:center;column-gap:12px;margin-bottom:11px}
  .bl{grid-column:1;grid-row:1;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .bn{font-size:.86rem;font-weight:500} .bq{font-size:.76rem;color:var(--faint)}
  .bt{grid-column:1;grid-row:2;height:8px;border-radius:5px;background:var(--raised);overflow:hidden}
  .bf{height:100%;border-radius:5px;background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 62%,#e8a))}
  .bv{grid-column:2;grid-row:1/3;text-align:right;font-weight:700}

  .empty{padding:30px;text-align:center;color:var(--muted)}
  .note{margin-top:18px;padding:13px 15px;background:var(--raised);border:1px solid var(--line);border-radius:12px;font-size:.82rem;color:var(--muted)}
  .note b{color:var(--ink)}
  footer{margin-top:20px;font-size:.76rem;color:var(--faint)}
  @media (prefers-reduced-motion:no-preference){.colbar .net,.bf{transition:height .25s,width .25s}}
</style>

<div class="wrap">
  <header>
    <h1>Das <span class="em">Dönerhaus</span> <span data-i18n="brandSuffix">· Analyse</span></h1>
    <span id="rangeLabel"></span>
    <div class="seg" id="langsel">
      <button data-lang="de" class="on">DE</button>
      <button data-lang="ru">RU</button>
    </div>
    <button id="refreshBtn" data-i18n="refresh" data-i18n-title="refreshTitle" title="Neueste Daten laden">🔄 Aktualisieren</button>
  </header>

  <div id="gate" class="gate hidden">
    <div class="gatecard">
      <div class="gicon">🔒</div>
      <h2 data-i18n="gateTitle">Geschützt</h2>
      <p data-i18n="gateHint">Bitte Passwort eingeben, um die Auswertung anzuzeigen.</p>
      <form id="gform">
        <input type="password" id="gpw" autocomplete="current-password" data-i18n-ph="gatePh" placeholder="Passwort" autofocus>
        <button type="submit" data-i18n="gateBtn">Entsperren</button>
      </form>
      <div id="gerr" class="gerr"></div>
    </div>
  </div>

  <div id="dash" class="hidden">
    <div class="topnav" id="topnav">
      <button data-view="umsatz" class="on" data-i18n="nav_umsatz">📊 Umsatz</button>
      <button data-view="gehalt" data-i18n="nav_gehalt">🧾 Gehälter</button>
      <button data-view="kosten" data-i18n="nav_kosten">💸 Kosten</button>
      <button data-view="verbrauch" data-i18n="nav_verbrauch">📦 Verbrauch</button>
      <button data-view="pl" data-i18n="nav_pl">📈 P&amp;L</button>
    </div>

    <div id="view-umsatz">
    <div class="controls">
      <div class="seg" id="modes">
        <button data-mode="tag" class="on" data-i18n="mode_tag">Tag</button>
        <button data-mode="woche" data-i18n="mode_woche">Woche</button>
        <button data-mode="monat" data-i18n="mode_monat">Monat</button>
        <button data-mode="zeitraum" data-i18n="mode_zeitraum">Zeitraum</button>
      </div>
      <div class="pick" id="pickSingle">
        <label for="ref" data-i18n="lbl_datum">Datum</label>
        <input type="date" id="ref">
      </div>
      <div class="pick hidden" id="pickRange">
        <label for="from" data-i18n="lbl_von">von</label><input type="date" id="from">
        <label for="to" data-i18n="lbl_bis">bis</label><input type="date" id="to">
      </div>
    </div>

    <div id="app"></div>

    <div class="note" data-i18n-html="note_umsatz"></div>
    </div><!-- /view-umsatz -->

    <div id="view-gehalt" class="hidden">
      <div id="gehaltApp"></div>
    </div>

    <div id="view-kosten" class="hidden">
      <div id="kostenApp"></div>
    </div>

    <div id="view-verbrauch" class="hidden">
      <div id="verbrauchApp"></div>
    </div>

    <div id="view-pl" class="hidden">
      <div class="controls">
        <div class="seg" id="pl-modes">
          <button data-pmode="tag" class="on" data-i18n="mode_tag">Tag</button>
          <button data-pmode="woche" data-i18n="mode_woche">Woche</button>
          <button data-pmode="monat" data-i18n="mode_monat">Monat</button>
          <button data-pmode="zeitraum" data-i18n="mode_zeitraum">Zeitraum</button>
        </div>
        <div class="pick" id="pl-pickSingle"><label for="pl-ref" data-i18n="lbl_datum">Datum</label><input type="date" id="pl-ref"></div>
        <div class="pick hidden" id="pl-pickRange"><label for="pl-from" data-i18n="lbl_von">von</label><input type="date" id="pl-from"><label for="pl-to" data-i18n="lbl_bis">bis</label><input type="date" id="pl-to"></div>
        <span id="plRangeLabel"></span>
      </div>
      <div class="controls" style="margin-top:-8px">
        <span style="font-size:.8rem;color:var(--muted);align-self:center" data-i18n="pl_wareneinsatz">Wareneinsatz:</span>
        <div class="seg" id="pl-ansatz">
          <button data-ansatz="kasse" class="on" data-i18n="pl_kasse">Kassenbasiert</button>
          <button data-ansatz="periode" data-i18n="pl_periode">Periodengerecht</button>
        </div>
      </div>
      <div id="plApp"></div>
    </div>

    <footer id="foot"></footer>
  </div>
</div>

const fmt = (s,o) => String(s).replace(/\{(\w+)\}/g,(_,k)=> (o[k]!=null?o[k]:''));

let NF, PF;
function makeFormats(){ const loc = lang==='ru' ? 'ru-RU' : 'de-DE';
  NF = new Intl.NumberFormat(loc,{maximumFractionDigits:0});
  PF = new Intl.NumberFormat(loc,{minimumFractionDigits:1,maximumFractionDigits:1});
}
makeFormats();
const money = n => NF.format(Math.round(n||0));
const pct = n => PF.format(n||0);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const DOENER_KW = ['döner','doner','донер','dürüm','durum','дурум','kebab','кебаб','box','бокс','teller','тарелк','currywurst','вурст','burger','бургер','überback','запеч','combo','комбо'];
function isDoener(name){ const n=(name||'').toLowerCase(); if(n.includes('шоколад')||n.includes('schoko'))return false; return DOENER_KW.some(k=>n.includes(k)); }

const isoToDate = iso => { const [y,m,d]=iso.split('-').map(Number); return new Date(y,m-1,d); };
const dateToIso = dt => dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
const deOf = iso => { const [y,m,d]=iso.split('-'); return d+'.'+m+'.'+y; };
const ddmm = iso => { const [,m,d]=iso.split('-'); return d+'.'+m+'.'; };
function weekRange(iso){ const dt=isoToDate(iso); const off=(dt.getDay()+6)%7; const mon=new Date(dt); mon.setDate(dt.getDate()-off); const sun=new Date(mon); sun.setDate(mon.getDate()+6); return [dateToIso(mon),dateToIso(sun)]; }
function monthRange(iso){ const [y,m]=iso.split('-').map(Number); return [dateToIso(new Date(y,m-1,1)),dateToIso(new Date(y,m,0))]; }
// "· Ø X тг/Tag" bzw. "· Ø X/Tag"
const perDayTG = v => ' · Ø '+money(v)+' тг/'+t('day_short');
const perDay = v => ' · Ø '+money(v)+'/'+t('day_short');
const rangeSuffix = n => n>1 ? '  ·  '+n+' '+t('days_word') : '';

let DATA=null, days=[], MIN=null, MAX=null;
const state = { mode:'tag', ref:null, from:null, to:null };
const pState = { mode:'tag', ref:null, from:null, to:null };
let plAnsatz = 'kasse';
function plQuote(){ let tW=0,tU=0; for(const d of days){ const w=(DATA.varByDate&&DATA.varByDate[d.iso])||0; if(w>0){ tW+=w; tU+=d.revenue; } } return tU? tW/tU : 0; }

function effectiveRangeOf(st){
  if(st.mode==='tag') return [st.ref,st.ref];
  if(st.mode==='woche') return weekRange(st.ref);
  if(st.mode==='monat') return monthRange(st.ref);
  return [st.from,st.to];
}
function effectiveRange(){ return effectiveRangeOf(state); }

// Tagesgewinn (fuer P&L-Chart)
function profitDay(d){
  const a=aggregate([d]);
  const waren = plAnsatz==='periode' ? plQuote()*a.revenue : ((DATA.varByDate&&DATA.varByDate[d.iso])||0);
  const loehne=(DATA.laborByDate&&DATA.laborByDate[d.iso])||0;
  const fixTag=(DATA.kosten&&DATA.kosten.fixProTag)||0;
  return a.netTotal - waren - loehne - fixTag;
}

function renderPL(){
  const el=document.getElementById('plApp');
  const [f,t2]=effectiveRangeOf(pState);
  const list=days.filter(d=>d.iso>=f && d.iso<=t2);
  const nDays=list.length;
  document.getElementById('plRangeLabel').textContent=(f===t2?deOf(f):deOf(f)+' – '+deOf(t2))+(nDays>1?'  ·  '+nDays+' '+t('days_word'):'');
  if(!nDays){ el.innerHTML='<section class="card"><div class="empty">'+t('empty_pl')+'</div></section>'; return; }
  const a=aggregate(list);
  const warenActual=list.reduce((s,d)=>s+((DATA.varByDate&&DATA.varByDate[d.iso])||0),0);
  const quote=plQuote();
  const waren = plAnsatz==='periode' ? Math.round(quote*a.revenue) : warenActual;
  const loehne=list.reduce((s,d)=>s+((DATA.laborByDate&&DATA.laborByDate[d.iso])||0),0);
  const fixTag=(DATA.kosten&&DATA.kosten.fixProTag)||0;
  const fix=fixTag*nDays;
  const gewinn=a.netTotal-waren-loehne-fix;
  const pc=v=>a.revenue?PF.format(v/a.revenue*100)+' %':'–';
  const row=(l,v,cls)=>'<tr'+(cls?' class="'+cls+'"':'')+'><td>'+l+'</td><td class="num">'+money(v)+' тг</td><td class="num" style="color:var(--faint)">'+pc(v)+'</td></tr>';
  const gcol=gewinn>=0?'var(--good)':'#c0392b';
  let html='<section class="card"><h2>'+t('pl_titel')+'</h2>'
    +'<table class="gewinn"><thead><tr><th style="text-align:left"></th><th style="text-align:right;font-size:.72rem;color:var(--faint)">'+t('pl_betrag')+'</th><th style="text-align:right;font-size:.72rem;color:var(--faint)">'+t('pl_pct')+'</th></tr></thead><tbody>'
    +row(t('pl_umsatz'),a.revenue,'')
    +row(t('pl_minus_provision'),-a.commissionTotal,'')
    +row(t('pl_netto_umsatz'),a.netTotal,'mid')
    +row(t('pl_minus_waren'),-waren,'')
    +row(t('pl_minus_loehne'),-loehne,'')
    +row(t('pl_minus_fix'),-fix,'')
    +'</tbody><tfoot><tr><td>'+t('pl_ergebnis')+'</td><td class="num" style="color:'+gcol+'">'+money(gewinn)+' тг</td><td class="num" style="color:'+gcol+'">'+pc(gewinn)+'</td></tr></tfoot></table>'
    +'<div style="font-size:.76rem;color:var(--faint);margin-top:8px">'
    +(plAnsatz==='periode'
        ? fmt(t('pl_note_periode'),{q:PF.format(quote*100),w:money(warenActual)})
        : t('pl_note_kasse'))
    +fmt(t('pl_note_tail'),{f:money(fixTag),n:nDays})+'</div></section>';
  if(nDays>1){
    const vals=list.map(profitDay); const maxAbs=Math.max.apply(null,vals.map(Math.abs).concat([1])); const step=Math.ceil(nDays/12);
    let cols='';
    list.forEach((d,i)=>{ const g=vals[i]; const h=Math.abs(g)/maxAbs*100;
      cols+='<div class="col" title="'+deOf(d.iso)+': '+money(g)+' тг"><div class="colbar"><div style="height:'+h+'%;width:100%;background:'+(g>=0?'var(--good)':'#c0392b')+'"></div></div><span class="cl">'+((i%step===0)?ddmm(d.iso):'')+'</span></div>'; });
    html+='<section class="card" style="margin-top:14px"><h2>'+t('pl_gewinn_tag')+'</h2><div class="chart">'+cols+'</div></section>';
  }
  el.innerHTML=html;
}
function aggregate(list){
  const chGross={}; let revenue=0,menge=0,brutto=0,orders=0,revO=0,doener=0; const itemMap=new Map();
  for(const d of list){
    revenue+=d.revenue; menge+=d.menge; brutto+=d.brutto;
    if(d.orders){ orders+=d.orders; revO+=d.revenue; }
    for(const k in d.ch) chGross[k]=(chGross[k]||0)+d.ch[k];
    for(const it of d.items){ const cur=itemMap.get(it.n)||{n:it.n,m:0,e:0}; cur.m+=it.m; cur.e+=it.e; itemMap.set(it.n,cur); if(isDoener(it.n)) doener+=(it.m||0); }
  }
  const channels=DATA.channels.map(c=>{ const gross=chGross[c.key]||0; const commission=c.commissionable?gross*DATA.rate:0; return {...c,gross,commission,net:gross-commission}; })
    .filter(c=>c.gross>0).sort((a,b)=>b.gross-a.gross);
  const totalGross=channels.reduce((s,c)=>s+c.gross,0);
  channels.forEach(c=>c.pct=totalGross?c.gross/totalGross*100:0);
  const commissionTotal=channels.reduce((s,c)=>s+c.commission,0);
  const aggGross=channels.filter(c=>c.commissionable).reduce((s,c)=>s+c.gross,0);
  const items=[...itemMap.values()].filter(i=>i.e>0).sort((a,b)=>b.e-a.e).slice(0,10);
  return { revenue,menge,brutto,orders,doener,avgBon:orders?revO/orders:null,channels,commissionTotal,netTotal:revenue-commissionTotal,totalGross,aggGross,aggPct:totalGross?aggGross/totalGross*100:0,items };
}

  }
  // Gewinn (Betriebsergebnis) fuer den gewaehlten Zeitraum -- vorgezogen, weil

  // Gewinn zeigt (siehe Gewinn-Karte unten fuer die volle Herleitung).
  const waren=list.reduce((s,d)=>s+(DATA.varByDate&&DATA.varByDate[d.iso]||0),0);
  const loehne=list.reduce((s,d)=>s+(DATA.laborByDate&&DATA.laborByDate[d.iso]||0),0);
  const fixTag=(DATA.kosten&&DATA.kosten.fixProTag)||0;
  const fix=fixTag*nDays;

  const stacked=a.channels.map(c=>'<span class="seg" style="width:'+c.pct+'%;background:'+c.color+'" title="'+esc(c.label)+': '+pct(c.pct)+'%"></span>').join('');

    +'<tfoot><tr><td class="ch">'+t('gesamt')+'</td><td class="num">'+money(a.revenue)+'</td><td class="num prov"><span class="warn">−'+money(a.commissionTotal)+'</span></td><td class="num net">'+money(a.netTotal)+'</td></tr></tfoot></table></section>'
    +'<section class="card"><h2>'+t('blick')+'</h2>'
    +(a.avgBon!=null?'<div class="stat hl"><span class="sv">'+money(a.avgBon)+' <span style="font-size:.8rem;font-weight:600">тг</span></span><span class="sl">'+t('avg_bon')+'</span></div>':'')
    +(a.orders?'<div class="stat"><span class="sv">'+money(a.orders)+'</span><span class="sl">'+t('bestellungen')+(nDays>1?perDay(a.orders/nDays):'')+'</span></div>':'')
    +(a.doener?'<div class="stat"><span class="sv">'+money(a.doener)+(nDays===1?' <span style="font-size:.85rem;font-weight:700;color:'+(a.doener>=100?'var(--good)':'var(--warn)')+'">/ 100</span>':'')+'</span><span class="sl">'+t('doener_dishes')+(nDays>1?' · Ø '+money(a.doener/nDays)+'/'+t('day_short')+' ('+t('soll')+' 100)':(a.doener>=100?' · '+t('soll_erreicht'):' · '+t('soll')+' 100'))+'</span></div>':'')
    +'<div class="stat"><span class="sv">'+pct(a.aggPct)+' %</span><span class="sl">'+t('ueber_lieferdienste')+'</span></div>'
    +'<div class="stat"><span class="sv">'+money(a.commissionTotal)+' тг</span><span class="sl">'+t('provision_plattformen')+'</span></div>'
    +'<div class="stat"><span class="sv">'+money(a.revenue/(a.menge||1))+' тг</span><span class="sl">'+t('erloes_artikel')+'</span></div>'
    +'<div class="stat"><span class="sv" style="color:'+(gewinn>=0?'var(--good)':'#c0392b')+'">'+money(gewinn)+' тг</span><span class="sl">'+t('gewinn')+'</span></div></section></div>';
  const maxRev=Math.max.apply(null,a.items.map(i=>i.e).concat([1]));
  const tr=a.items.map(it=>'<div class="bar"><div class="bl"><span class="bn">'+esc(it.n)+'</span><span class="bq">'+it.m+'×</span></div><div class="bt"><div class="bf" style="width:'+(it.e/maxRev*100)+'%"></div></div><div class="bv">'+money(it.e)+'</div></div>').join('');
  html+='<section class="card" style="margin-top:14px"><h2>'+t('top_artikel')+(nDays>1?' ('+t('zeitraum_summe')+')':'')+'</h2>'+tr+'</section>';

  // Gewinn-Rechnung fuer den gewaehlten Zeitraum (waren/loehne/fix/gewinn

  const zeile=(l,v,cls)=>'<tr'+(cls?' class="'+cls+'"':'')+'><td>'+l+'</td><td class="num">'+money(v)+' тг</td></tr>';
  html+='<section class="card" style="margin-top:14px"><h2>'+t('gewinn')+(nDays>1?' · '+nDays+' '+t('days_word'):' · '+t('day_short'))+'</h2>'
    +'<table class="gewinn"><tbody>'

function renderKosten(){
  const el=document.getElementById('kostenApp');
  const k=DATA.kosten||{fix:[],fixMonat:0,variabel:{byLieferant:[],total:0,count:0}};
  const fixRows=k.fix.map(f=>'<tr><td class="ch">'+esc(f.name)+(f.faellig?' <span style="color:var(--faint);font-size:.75rem">('+esc(f.faellig)+')</span>':'')+'</td><td class="num">'+(f.ca?'~':'')+money(f.betrag)+'</td><td class="num" style="color:var(--muted)">'+esc(f.rhythmus)+'</td><td class="num net"><b>'+money(f.proMonat)+'</b></td></tr>').join('');
  let html='<section class="card" style="margin-bottom:14px"><h2>'+t('fixe_kosten')+'</h2>'
    +'<table><thead><tr><th class="l">'+t('kostenart')+'</th><th>'+t('betrag')+'</th><th>'+t('rhythmus')+'</th><th>'+t('pro_monat')+'</th></tr></thead><tbody>'+fixRows+'</tbody>'
    +'<tfoot><tr><td class="ch">'+t('summe_fix')+'</td><td class="num"></td><td class="num"></td><td class="num net">'+money(k.fixMonat)+' тг</td></tr></tfoot></table></section>';
  const v=k.variabel;
  if(!v || !v.byLieferant.length){
    html+='<section class="card"><h2>'+t('variable_kosten')+'</h2><div class="empty">'+t('empty_kosten')+'</div></section>';
  } else {
    const monate=(v.byMonat||[]).slice().sort((a,b)=>b.monat.localeCompare(a.monat));
    const blocks=monate.map((m,i)=>{
      const rows=m.byLieferant.map(l=>'<tr><td class="ch">'+esc(l.lieferant)+'</td><td class="num">'+l.count+'</td><td class="num net"><b>'+money(l.sum)+'</b></td></tr>').join('');
      return '<details class="monat"'+(i===0?' open':'')+'><summary><span><span class="car">▸</span>'+monatLabel(m.monat)+'</span><span class="msum">'+money(m.total)+' тг</span></summary>'
        +'<table><thead><tr><th class="l">'+t('lieferant')+'</th><th>'+t('rechnungen')+'</th><th>'+t('summe')+'</th></tr></thead><tbody>'+rows+'</tbody>'
        +'<tfoot><tr><td class="ch">'+t('gesamt')+'</td><td class="num">'+m.count+'</td><td class="num net">'+money(m.total)+' тг</td></tr></tfoot></table></details>';
    }).join('');
    html+='<section class="card"><h2>'+t('var_je_lieferant')+'</h2>'+blocks+'</section>';
  }
  // Variable Kosten pro Tag (mit aufgelaufener Summe), pro Monat aufklappbar -- die
  // aufgelaufene Summe startet je Monat wieder bei 0 (nicht ueber den ganzen Datensatz).
  const vbd=DATA.varByDate||{};
  const vdates=Object.keys(vbd).sort();
  if(vdates.length){
    const byMonatTag=new Map();
    for(const d of vdates){ const mo=d.slice(0,7); if(!byMonatTag.has(mo)) byMonatTag.set(mo,[]); byMonatTag.get(mo).push(d); }
    const monate=[...byMonatTag.keys()].sort().reverse();
    const blocks=monate.map((mo,i)=>{
      let cum=0, gesamt=0;
      const rows=byMonatTag.get(mo).map(d=>{ cum+=vbd[d]; gesamt=cum; return '<tr><td class="ch">'+deOf(d)+'</td><td class="num">'+money(vbd[d])+'</td><td class="num net"><b>'+money(cum)+'</b></td></tr>'; }).join('');
      return '<details class="monat"'+(i===0?' open':'')+'><summary><span><span class="car">▸</span>'+monatLabel(mo)+'</span><span class="msum">'+money(gesamt)+' тг</span></summary>'
        +'<table><thead><tr><th class="l">'+t('datum')+'</th><th>'+t('tageskosten')+'</th><th>'+t('aufgelaufen')+'</th></tr></thead><tbody>'+rows+'</tbody></table></details>';
    }).join('');
    html+='<section class="card" style="margin-top:14px"><h2>'+t('var_pro_tag')+'</h2>'+blocks+'</section>';
  }
  el.innerHTML=html;
}

function applyStatic(){
  document.querySelectorAll('[data-i18n]').forEach(el=>{ el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-html]').forEach(el=>{ el.innerHTML = t(el.dataset.i18nHtml); });
  document.querySelectorAll('[data-i18n-ph]').forEach(el=>{ el.setAttribute('placeholder', t(el.dataset.i18nPh)); });
  document.querySelectorAll('[data-i18n-title]').forEach(el=>{ el.setAttribute('title', t(el.dataset.i18nTitle)); });
  const rn=document.getElementById('rateNote'); if(rn && DATA) rn.textContent=pct(DATA.rate*100)+' %';
  try{ document.title = t('doc_title'); }catch(e){}
}
function setLang(l){
  lang = (l==='ru') ? 'ru' : 'de';
  try{ localStorage.setItem('ddh_lang',lang); }catch(e){}
  makeFormats();
  if(document.documentElement) document.documentElement.lang = lang;
  [...document.querySelectorAll('#langsel button')].forEach(b=>b.classList.toggle('on',b.dataset.lang===lang));
  applyStatic();
  if(DATA){ render(); renderGehalt(); renderKosten(); renderVerbrauch(); renderPL(); }
}

function init(data){
  DATA=data;
  days=DATA.days.slice().sort((a,b)=>a.iso.localeCompare(b.iso));
  MIN=days[0].iso; MAX=days[days.length-1].iso;
  state.mode='tag'; state.ref=MAX; state.from=MIN; state.to=MAX;
  document.getElementById('modes').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return;
    state.mode=b.dataset.mode;
    [...document.querySelectorAll('#modes button')].forEach(x=>x.classList.toggle('on',x===b));
    document.getElementById('pickSingle').classList.toggle('hidden',state.mode==='zeitraum');
    document.getElementById('pickRange').classList.toggle('hidden',state.mode!=='zeitraum');
    render(); });
  const ref=document.getElementById('ref'),from=document.getElementById('from'),to=document.getElementById('to');
  [ref,from,to].forEach(inp=>{ inp.min=MIN; inp.max=MAX; });
  ref.value=state.ref; from.value=state.from; to.value=state.to;
  ref.addEventListener('change',()=>{ state.ref=ref.value||MAX; render(); });
  from.addEventListener('change',()=>{ state.from=from.value||MIN; if(state.to<state.from){state.to=state.from;to.value=state.to;} render(); });
  to.addEventListener('change',()=>{ state.to=to.value||MAX; if(state.to<state.from){state.from=state.to;from.value=state.from;} render(); });
  const rn=document.getElementById('rateNote'); if(rn) rn.textContent=pct(DATA.rate*100)+' %';
  document.getElementById('foot').textContent=fmt(t('foot'),{n:days.length,min:deOf(MIN),max:deOf(MAX)});
  document.getElementById('dash').classList.remove('hidden');
  render();
  renderGehalt();
  renderKosten();
  renderVerbrauch();

  // P&L-Reiter: eigener Zeitraum-Wähler
  pState.mode='tag'; pState.ref=MAX; pState.from=MIN; pState.to=MAX;
  document.getElementById('pl-modes').addEventListener('click',(e)=>{ const b=e.target.closest('button'); if(!b) return;
    pState.mode=b.dataset.pmode;
    [...document.querySelectorAll('#pl-modes button')].forEach((x)=>x.classList.toggle('on',x===b));
    document.getElementById('pl-pickSingle').classList.toggle('hidden',pState.mode==='zeitraum');
    document.getElementById('pl-pickRange').classList.toggle('hidden',pState.mode!=='zeitraum');
    renderPL(); });
  const pref=document.getElementById('pl-ref'),pfrom=document.getElementById('pl-from'),pto=document.getElementById('pl-to');
  [pref,pfrom,pto].forEach((inp)=>{ inp.min=MIN; inp.max=MAX; });
  pref.value=pState.ref; pfrom.value=pState.from; pto.value=pState.to;
  pref.addEventListener('change',()=>{ pState.ref=pref.value||MAX; renderPL(); });
  pfrom.addEventListener('change',()=>{ pState.from=pfrom.value||MIN; if(pState.to<pState.from){pState.to=pState.from;pto.value=pState.to;} renderPL(); });
  pto.addEventListener('change',()=>{ pState.to=pto.value||MAX; if(pState.to<pState.from){pState.from=pState.to;pfrom.value=pState.from;} renderPL(); });
  document.getElementById('pl-ansatz').addEventListener('click',(e)=>{ const b=e.target.closest('button'); if(!b) return;
    plAnsatz=b.dataset.ansatz;
    [...document.querySelectorAll('#pl-ansatz button')].forEach((x)=>x.classList.toggle('on',x===b));
    renderPL(); });
  renderPL();

  document.getElementById('topnav').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    const v = b.dataset.view;
    [...document.querySelectorAll('#topnav button')].forEach((x) => x.classList.toggle('on', x === b));
    ['umsatz', 'gehalt', 'kosten', 'verbrauch', 'pl'].forEach((n) => document.getElementById('view-' + n).classList.toggle('hidden', n !== v));
  });
}

// --- Entschlüsselung / Passwort-Gate ---
const b64d = s => { const bin=atob(s); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i); return u; };
async function decrypt(pw){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64d(BOOT.salt),iterations:200000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(BOOT.iv)},key,b64d(BOOT.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
function unlock(data){ document.getElementById('gate').classList.add('hidden'); init(data); }

if(!BOOT.enc){
  init(BOOT.data);
}else{
  const gate=document.getElementById('gate'), form=document.getElementById('gform'), pw=document.getElementById('gpw'), err=document.getElementById('gerr');
  gate.classList.remove('hidden');
  const trySilent=async()=>{ const saved=sessionStorage.getItem('ddh_pw'); if(!saved) return; try{ unlock(await decrypt(saved)); }catch{ sessionStorage.removeItem('ddh_pw'); } };
  form.addEventListener('submit',async e=>{ e.preventDefault(); err.textContent=''; try{ const data=await decrypt(pw.value); sessionStorage.setItem('ddh_pw',pw.value); unlock(data); }catch{ err.textContent=t('gateErr'); pw.select(); } });
  trySilent();
}
